name: CI

# Every push runs the checks, so a branch is tested before its pull request is even opened.
on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A newer push to the same branch makes the older run pointless.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CI: "true"
  # The web build reads these (vite.config.ts); the site is served from the root.
  PORT: "5173"
  BASE_PATH: "/"

jobs:
  checks:
    name: Types, translations, unit tests, build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Translations (ru / kk / en)
        run: pnpm --filter @workspace/scripts run check:i18n

      - name: Unit tests
        run: pnpm run test

      - name: Database migrations match the schema
        run: |
          pnpm --filter @workspace/db run generate
          if [ -n "$(git status --porcelain lib/db/migrations)" ]; then
            echo "The schema in lib/db/src/schema changed without a migration." >&2
            echo "Run: pnpm --filter @workspace/db run generate, review the SQL and commit it." >&2
            git status --porcelain lib/db/migrations >&2
            exit 1
          fi

      - name: Build
        run: |
          NODE_ENV=production pnpm --filter @workspace/shift-market run build
          NODE_ENV=production pnpm --filter @workspace/api-server run build

  api-tests:
    name: API tests with PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: reflect
          POSTGRES_USER: reflect
          POSTGRES_PASSWORD: reflect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflect -d reflect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reflect:reflect@localhost:5432/reflect
      ENCRYPTION_KEY: ci-only-encryption-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Apply migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Apply migrations again (must be a no-op)
        run: pnpm --filter @workspace/db run migrate

      - name: Build and start the API
        run: |
          NODE_ENV=production pnpm --filter @workspace/api-server run build
          NODE_ENV=production PORT=8080 node artifacts/api-server/dist/index.mjs > api.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/readyz >/dev/null && exit 0
            sleep 1
          done
          echo "API did not become ready" >&2
          cat api.log >&2
          exit 1

      - name: Data isolation, sign-up race, sync lock, sign out everywhere
        env:
          TEST_API_URL: http://127.0.0.1:8080/api
        run: pnpm --filter @workspace/api-server run test

      - name: API log
        if: failure()
        run: cat api.log

  e2e:
    name: Browser tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: reflect
          POSTGRES_USER: reflect
          POSTGRES_PASSWORD: reflect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflect -d reflect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      DATABASE_URL: postgres://reflect:reflect@localhost:5432/reflect
      ENCRYPTION_KEY: ci-only-encryption-key-not-a-secret
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.28.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Install Chromium
        run: pnpm --filter @workspace/shift-market exec playwright install --with-deps chromium

      - name: Apply migrations
        run: pnpm --filter @workspace/db run migrate

      - name: Build the web app and the API
        run: |
          pnpm --filter @workspace/shift-market run build
          NODE_ENV=production pnpm --filter @workspace/api-server run build

      # The API serves the built site, as in production. The demo dates are pinned for the tests.
      # Stand-ins for the Kaspi seller API and RedStat's MCP server, so sign-up by token and the
      # market view are tested without a real shop or RedStat account. MCP_ALLOW_PRIVATE lets the
      # API reach the local RedStat stand-in; production never sets it.
      - name: Start the app
        run: |
          node artifacts/shift-market/e2e/fake-kaspi.mjs 8099 > fake-kaspi.log 2>&1 &
          node artifacts/shift-market/e2e/fake-redstat.mjs 8098 > fake-redstat.log 2>&1 &
          NODE_ENV=production PORT=8080 STATIC_DIR=artifacts/shift-market/dist/public DEMO_SNAPSHOT_DATE=2026-08-18 \
            KASPI_API_BASE=http://127.0.0.1:8099/shop/api/v2 MCP_ALLOW_PRIVATE=1 \
            node artifacts/api-server/dist/index.mjs > app.log 2>&1 &
          for i in $(seq 1 30); do
            curl -fsS http://127.0.0.1:8080/api/readyz >/dev/null && exit 0
            sleep 1
          done
          echo "App did not become ready" >&2
          cat app.log >&2
          exit 1

      - name: Languages, demo, sign-up, import, recommendations in a real browser
        env:
          SHIFT_MARKET_TEST_BASE_URL: http://localhost:8080
          FAKE_KASPI: "1"
          FAKE_REDSTAT: "1"
        run: pnpm --filter @workspace/shift-market run test:e2e

      - name: App log
        if: failure()
        run: tail -n 200 app.log

  docker:
    name: Docker deployment (compose, backups, admin scripts)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Create .env
        run: |
          cp .env.example .env
          sed -i "s|^DOMAIN=.*|DOMAIN=localhost|; s|^POSTGRES_PASSWORD=.*|POSTGRES_PASSWORD=ci-$(openssl rand -hex 8)|; s|^ENCRYPTION_KEY=.*|ENCRYPTION_KEY=$(openssl rand -hex 32)|" .env
          mkdir -p backups

      - name: Build images
        run: docker compose build app migrate

      - name: Database up, migrations (twice)
        run: |
          docker compose up -d db
          docker compose run --rm migrate
          docker compose run --rm migrate

      - name: Start app and backup service
        run: |
          docker compose up -d app backup
          for i in $(seq 1 40); do
            status=$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")
            [ "$status" = "healthy" ] && echo "app healthy" && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: First backup appears
        run: |
          for i in $(seq 1 30); do ls backups/reflect-*.dump >/dev/null 2>&1 && break; sleep 2; done
          ls -la backups
          ls backups/reflect-*.dump

      - name: Backup restores into a temporary database
        run: ./deploy/verify-backup.sh

      - name: Admin scripts (data-only, whole account, unlock)
        run: |
          psql_db() { docker compose exec -T db psql -U reflect -d reflect -At -v ON_ERROR_STOP=1 "$@"; }
          # ci-user is alone in their shop and shares an agency with a colleague: only the shop is theirs to delete.
          psql_db -c "insert into users(id,email,password_hash) values ('ci-user','ci@example.kz','x'), ('ci-colleague','colleague@example.kz','x')"
          psql_db -c "insert into workspaces(id,kind,name) values ('ci-ws','SHOP','CI shop'), ('ci-shared','AGENCY','CI agency')"
          psql_db -c "insert into workspace_members(workspace_id,user_id,role) values ('ci-ws','ci-user','OWNER'), ('ci-shared','ci-user','OWNER'), ('ci-shared','ci-colleague','MEMBER')"
          psql_db -c "insert into orders(workspace_id,order_code,line_key,ordered_at,sku,quantity,amount,status,source) values ('ci-ws','1','A#1',now(),'A',1,100,'SOLD','FILE'), ('ci-shared','2','B#1',now(),'B',1,100,'SOLD','FILE')"
          psql_db -c "insert into integrations(workspace_id,kind,status) values ('ci-ws','KASPI_API','CONNECTED')"

          printf 'ci@example.kz\n' | ./deploy/delete-account.sh --data-only ci@example.kz
          [ "$(psql_db -c "select count(*) from orders where workspace_id='ci-ws'")" = "0" ] || { echo "orders were not deleted"; exit 1; }
          [ "$(psql_db -c "select count(*) from orders where workspace_id='ci-shared'")" = "1" ] || { echo "--data-only touched a shared workspace"; exit 1; }
          [ "$(psql_db -c "select count(*) from users where id='ci-user'")" = "1" ] || { echo "--data-only removed the account"; exit 1; }
          [ "$(psql_db -c "select count(*) from integrations where workspace_id='ci-ws'")" = "1" ] || { echo "--data-only removed the connection"; exit 1; }

          # wrong confirmation must delete nothing
          printf 'nope\n' | ./deploy/delete-account.sh ci@example.kz && { echo "deleted without confirmation"; exit 1; } || true
          [ "$(psql_db -c "select count(*) from users where id='ci-user'")" = "1" ] || { echo "account removed without confirmation"; exit 1; }

          printf 'ci@example.kz\n' | ./deploy/delete-account.sh ci@example.kz
          [ "$(psql_db -c "select count(*) from users where id='ci-user'")" = "0" ] || { echo "account was not deleted"; exit 1; }
          [ "$(psql_db -c "select count(*) from integrations where workspace_id='ci-ws'")" = "0" ] || { echo "connection survived account deletion"; exit 1; }
          [ "$(psql_db -c "select count(*) from workspaces where id='ci-ws'")" = "0" ] || { echo "the person's own workspace survived"; exit 1; }
          [ "$(psql_db -c "select count(*) from orders where workspace_id='ci-shared'")" = "1" ] || { echo "a shared workspace lost its data"; exit 1; }
          [ "$(psql_db -c "select count(*) from workspace_members where workspace_id='ci-shared'")" = "1" ] || { echo "the colleague lost access"; exit 1; }
          [ "$(psql_db -c "select role from workspace_members where workspace_id='ci-shared'")" = "OWNER" ] || { echo "the shared workspace was left without an owner"; exit 1; }
          ls backups/before-delete-*.dump

          key="login:$(printf '%s' 'locked@example.kz' | sha256sum | cut -d' ' -f1)"
          psql_db -c "insert into rate_limits(key,count,reset_at) values ('$key',4,now() + interval '10 minutes')"
          ./deploy/unlock-login.sh locked@example.kz | grep -q "Unlocked"
          [ "$(psql_db -c "select count(*) from rate_limits where key='$key'")" = "0" ] || { echo "login block was not lifted"; exit 1; }

      - name: Restore a backup over the database, app comes back
        run: |
          dump=$(ls -t backups/reflect-*.dump | head -1)
          printf 'y\n' | ./deploy/restore.sh "$dump"
          for i in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = "healthy" ] && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: update.sh (backup, rebuild, migrate, restart)
        run: |
          ./deploy/update.sh
          ls backups/before-update-*.dump
          for i in $(seq 1 40); do
            [ "$(docker inspect --format '{{.State.Health.Status}}' "$(docker compose ps -q app)")" = "healthy" ] && exit 0
            sleep 3
          done
          docker compose logs app
          exit 1

      - name: Off-site copy (to a local folder standing in for remote storage)
        run: |
          BACKUP_REMOTE=/tmp/remote BACKUP_OFFSITE_EVERY_HOURS=1 BACKUP_OFFSITE_MIN_AGE=1s docker compose --profile offsite up -d offsite
          for i in $(seq 1 30); do
            docker compose logs offsite 2>&1 | grep -q "offsite: copied" && break
            sleep 2
          done
          docker compose logs offsite
          docker compose exec -T offsite ls /tmp/remote | grep -q "reflect-"

      - name: Off-site service refuses to start without a target
        run: |
          docker compose --profile offsite stop offsite
          if docker compose --profile offsite run --rm -e BACKUP_REMOTE= offsite 2>&1 | grep -q "BACKUP_REMOTE is not set"; then echo ok; else exit 1; fi

      - name: Test setup on a fresh checkout (deploy/try-local.sh, http://localhost:8080)
        run: |
          docker compose down -v
          rm -f .env
          sh deploy/try-local.sh
          curl -fsS http://localhost:8080/api/readyz
          curl -fsS http://localhost:8080/ | grep -q '<div id="root">'
          # Admin password reset link: created by the script, accepted by the app.
          json='Content-Type: application/json'
          origin='Origin: http://localhost:8080'
          curl -fsS -o /dev/null -H "$json" -H "$origin" -d '{"email":"reset-ci@example.kz","password":"old-password-1"}' http://localhost:8080/api/auth/register
          link=$(bash deploy/reset-password.sh reset-ci@example.kz | tail -n1)
          token=${link##*token=}
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$json" -H "$origin" -d "{\"token\":\"$token\",\"password\":\"new-password-2\"}" http://localhost:8080/api/auth/password-reset)
          test "$code" = "200"
          code=$(curl -s -o /dev/null -w '%{http_code}' -H "$json" -H "$origin" -d "{\"token\":\"$token\",\"password\":\"new-password-3\"}" http://localhost:8080/api/auth/password-reset)
          test "$code" = "400"
          if bash deploy/reset-password.sh nobody@example.kz; then exit 1; fi
          sh deploy/try-local.sh reset

      - name: Logs
        if: failure()
        run: docker compose logs --tail=100
