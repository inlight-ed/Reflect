# Reflect on your own server: app + PostgreSQL + Caddy (HTTPS) + daily backups.
#
#   cp .env.example .env            # fill in DOMAIN, POSTGRES_PASSWORD, ENCRYPTION_KEY
#   docker compose build
#   docker compose run --rm migrate # creates / updates tables
#   docker compose up -d
#
# See DEPLOY.md for the full guide.
name: reflect

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reflect
      POSTGRES_USER: reflect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflect -d reflect"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runtime
    image: reflect-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reflect:${POSTGRES_PASSWORD}@db:5432/reflect
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  # One-off: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrate
    image: reflect-migrate
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://reflect:${POSTGRES_PASSWORD}@db:5432/reflect
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nightly pg_dump into ./backups, keeps the last BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: reflect
      PGDATABASE: reflect
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
  caddy_data:
  caddy_config:
