# Reflect on your own server: app + PostgreSQL + Caddy (HTTPS) + daily backups.
#
#   cp .env.example .env            # fill in DOMAIN, POSTGRES_PASSWORD, ENCRYPTION_KEY
#   docker compose build
#   docker compose run --rm migrate # creates / updates tables
#   docker compose up -d
#
# See DEPLOY.md for the full guide.
name: reflect

services:
  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: reflect
      POSTGRES_USER: reflect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      # PostgreSQL 18 images keep data under /var/lib/postgresql (not .../data).
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflect -d reflect"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
      target: runtime
    image: reflect-app
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://reflect:${POSTGRES_PASSWORD}@db:5432/reflect
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?set ENCRYPTION_KEY in .env}
    depends_on:
      db:
        condition: service_healthy
    expose:
      - "8080"

  # One-off: docker compose run --rm migrate
  migrate:
    build:
      context: .
      target: migrate
    image: reflect-migrate
    profiles: ["tools"]
    environment:
      DATABASE_URL: postgres://reflect:${POSTGRES_PASSWORD}@db:5432/reflect
    depends_on:
      db:
        condition: service_healthy

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMAIN: ${DOMAIN:?set DOMAIN in .env}
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app

  # Nightly pg_dump into ./backups, keeps the last BACKUP_KEEP_DAYS days.
  backup:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      PGHOST: db
      PGUSER: reflect
      PGDATABASE: reflect
      PGPASSWORD: ${POSTGRES_PASSWORD}
      BACKUP_KEEP_DAYS: ${BACKUP_KEEP_DAYS:-14}
    volumes:
      - ./backups:/backups
      - ./deploy/backup.sh:/backup.sh:ro
    entrypoint: ["/bin/sh", "/backup.sh"]
    depends_on:
      db:
        condition: service_healthy

  # Optional and off by default: copies ./backups to a storage somewhere else (S3-compatible, SFTP, ...)
  # so the backups survive the loss of this server. Fill BACKUP_REMOTE and RCLONE_CONFIG_* in .env
  # (DEPLOY.md, section 14), then:  docker compose --profile offsite up -d offsite
  # Only the variables listed here reach the container, not the database password or ENCRYPTION_KEY.
  offsite:
    image: rclone/rclone:1
    profiles: ["offsite"]
    restart: unless-stopped
    environment:
      - BACKUP_REMOTE
      - BACKUP_OFFSITE_EVERY_HOURS
      - BACKUP_REMOTE_KEEP_DAYS
      - BACKUP_OFFSITE_MIN_AGE
      - RCLONE_CONFIG_OFFSITE_TYPE
      - RCLONE_CONFIG_OFFSITE_PROVIDER
      - RCLONE_CONFIG_OFFSITE_ENDPOINT
      - RCLONE_CONFIG_OFFSITE_REGION
      - RCLONE_CONFIG_OFFSITE_ACCESS_KEY_ID
      - RCLONE_CONFIG_OFFSITE_SECRET_ACCESS_KEY
      - RCLONE_CONFIG_OFFSITE_HOST
      - RCLONE_CONFIG_OFFSITE_USER
      - RCLONE_CONFIG_OFFSITE_PASS
      - RCLONE_CONFIG_OFFSITECRYPT_TYPE
      - RCLONE_CONFIG_OFFSITECRYPT_REMOTE
      - RCLONE_CONFIG_OFFSITECRYPT_PASSWORD
      - RCLONE_CONFIG_OFFSITECRYPT_PASSWORD2
    volumes:
      - ./backups:/backups:ro
      - ./deploy/offsite.sh:/offsite.sh:ro
    entrypoint: ["/bin/sh", "/offsite.sh"]

volumes:
  pgdata:
  caddy_data:
  caddy_config:
