openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Accounts and sessions
  - name: data
    description: Seller data imports and outcomes
  - name: integrations
    description: Connected services
  - name: intelligence
    description: Reflect demo intelligence
  - name: media
    description: Agency media plans, plan against fact
  - name: workspaces
    description: Shops and agencies, their members, invitation links and clients
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAccount
      tags: [auth]
      summary: Create an account with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RegisterInput" }
      responses:
        "201":
          description: Account created and signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { description: Invalid email or weak password, content: { application/json: { schema: { $ref: "#/components/schemas/AuthErrorBody" } } } }
        "409": { description: Email already registered, content: { application/json: { schema: { $ref: "#/components/schemas/AuthErrorBody" } } } }
        "503": { description: Accounts unavailable, content: { application/json: { schema: { $ref: "#/components/schemas/AuthErrorBody" } } } }
  /auth/login:
    post:
      operationId: loginAccount
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/LoginInput" }
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "401": { description: Wrong email or password, content: { application/json: { schema: { $ref: "#/components/schemas/AuthErrorBody" } } } }
        "429": { description: Too many attempts }
  /auth/password-reset/request:
    post:
      operationId: requestPasswordReset
      tags: [auth]
      summary: Send a one-time password reset link to the email (same answer whether or not the account exists)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetRequest" }
      responses:
        "202":
          description: Accepted
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "429": { description: Too many requests }
  /auth/password-reset:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password from a reset link; ends every session and signs in
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PasswordResetInput" }
      responses:
        "200":
          description: Password changed, signed in
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AuthUser" }
        "400": { description: "Invalid or used link, or weak password", content: { application/json: { schema: { $ref: "#/components/schemas/AuthErrorBody" } } } }
  /auth/logout:
    post:
      operationId: logoutAccount
      tags: [auth]
      summary: Sign out
      responses:
        "204": { description: Signed out }
  /auth/logout-all:
    post:
      operationId: logoutEverywhere
      tags: [auth]
      summary: Sign out on every device (ends all sessions)
      responses:
        "204": { description: All sessions ended }
        "401": { description: Sign in required }
  /auth/me:
    get:
      operationId: getSession
      tags: [auth]
      summary: Current session and onboarding state
      responses:
        "200":
          description: Session
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SessionState" }
  /data/import:
    post:
      operationId: importData
      tags: [data]
      summary: Import normalised rows from a file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ImportInput" }
      responses:
        "200":
          description: Imported
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ImportResult" }
        "400": { description: No valid rows }
        "401": { description: Sign in required }
  /data/product-costs:
    put:
      operationId: updateProductCosts
      tags: [data]
      summary: Set a product's costs, stock or lead time by hand
      description: Only the fields sent change; null clears a value. A SKU sold but missing from the catalog is added.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ProductCostsInput" }
      responses:
        "200":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/OkResponse" }
        "400": { description: Invalid values }
        "401": { description: Sign in required }
  /data/status:
    get:
      operationId: getDataStatus
      tags: [data]
      summary: What data the seller has loaded
      responses:
        "200":
          description: Data status
          content:
            application/json:
              schema: { $ref: "#/components/schemas/DataStatus" }
        "401": { description: Sign in required }
  /feedback:
    get:
      operationId: listFeedback
      tags: [data]
      summary: Recommendation outcomes with numbers before and after
      responses:
        "200":
          description: Feedback
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/FeedbackItem" }
        "401": { description: Sign in required }
    post:
      operationId: createFeedback
      tags: [data]
      summary: Mark a recommendation as worked / did not work / too early
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FeedbackInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FeedbackItem" }
        "401": { description: Sign in required }
  /content/analysis:
    get:
      operationId: getCardAnalysis
      tags: [intelligence]
      summary: Card analysis from reviews, sales and logged card changes
      parameters:
        - { in: query, name: sku, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Card analysis
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardAnalysis" }
  /content/events:
    post:
      operationId: createCardEvent
      tags: [intelligence]
      summary: Log a change to a product card
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CardEventInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/CardEvent" }
        "401": { description: Sign in required }
  /integrations/{kind}:
    put:
      operationId: saveConnection
      tags: [integrations]
      summary: Save and test a connection
      parameters:
        - { in: path, name: kind, required: true, schema: { $ref: "#/components/schemas/ConnectionKind" } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ConnectionInput" }
      responses:
        "200":
          description: Connection after testing
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "400": { description: Invalid input }
        "401": { description: Sign in required }
    delete:
      operationId: deleteConnection
      tags: [integrations]
      summary: Remove a connection and its stored key
      parameters:
        - { in: path, name: kind, required: true, schema: { $ref: "#/components/schemas/ConnectionKind" } }
      responses:
        "204": { description: Removed }
        "401": { description: Sign in required }
  /integrations/{kind}/sync:
    post:
      operationId: syncConnection
      tags: [integrations]
      summary: Start pulling fresh data from a connected service
      description: Starts the sync in the background and returns the connection with status SYNCING. Poll the connection until the status changes. A second call while a sync runs joins it.
      parameters:
        - { in: path, name: kind, required: true, schema: { $ref: "#/components/schemas/ConnectionKind" } }
      responses:
        "200":
          description: Connection, usually with status SYNCING
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Connection" }
        "401": { description: Sign in required }
  /integrations/runs:
    get:
      operationId: getSyncRuns
      tags: [integrations]
      summary: Recent sync runs (newest first)
      responses:
        "200":
          description: Run log
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncRun" }
        "401": { description: Sign in required }
  /shift-market/dashboard:
    get:
      operationId: getDashboard
      tags: [intelligence]
      summary: Get executive dashboard
      parameters:
        - { in: query, name: period, required: false, schema: { type: string, enum: ["7", "30", "90"] } }
        - { in: query, name: compare, required: false, schema: { type: string, enum: [previous, year] } }
      responses:
        "200":
          description: Executive dashboard data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardOverview"
  /shift-market/advertising:
    get:
      operationId: getAdvertising
      tags: [intelligence]
      summary: Get advertising intelligence
      parameters:
        - { in: query, name: period, required: false, schema: { type: string, enum: ["7", "30", "90"] } }
        - { in: query, name: compare, required: false, schema: { type: string, enum: [previous, year] } }
      responses:
        "200":
          description: Advertising data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AdvertisingOverview"
  /shift-market/attention:
    get:
      operationId: getAttention
      tags: [intelligence]
      summary: Everything that crossed a threshold, most serious and costly first
      parameters:
        - { in: query, name: period, required: false, schema: { type: string, enum: ["7", "30", "90"] } }
        - { in: query, name: compare, required: false, schema: { type: string, enum: [previous, year] } }
      responses:
        "200":
          description: Attention list
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AttentionOverview" }
  /shift-market/products:
    get:
      operationId: getProducts
      tags: [intelligence]
      summary: Get product opportunity data
      parameters:
        - { in: query, name: period, required: false, schema: { type: string, enum: ["7", "30", "90"] } }
        - { in: query, name: compare, required: false, schema: { type: string, enum: [previous, year] } }
      responses:
        "200":
          description: Product data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ProductsOverview"
  /workspaces:
    get:
      operationId: getWorkspaces
      tags: [workspaces]
      summary: Workspaces the person is a member of
      responses:
        "200":
          description: Workspaces
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Workspace" } }
        "401": { description: Sign in required }
    post:
      operationId: createWorkspace
      tags: [workspaces]
      summary: Create a shop or agency workspace and open it
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/WorkspaceInput" }
      responses:
        "201":
          description: Created and opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { description: Invalid name or too many workspaces }
        "401": { description: Sign in required }
  /workspaces/{workspaceId}/open:
    post:
      operationId: openWorkspace
      tags: [workspaces]
      summary: Open another workspace in this session
      parameters:
        - { in: path, name: workspaceId, required: true, schema: { type: string } }
      responses:
        "200":
          description: Opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { description: Sign in required }
        "404": { description: Not a member }
  /workspace:
    patch:
      operationId: renameWorkspace
      tags: [workspaces]
      summary: Rename the open workspace (owner only)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "400": { description: Invalid name }
        "403": { description: Owner only }
  /workspace/members:
    get:
      operationId: getWorkspaceMembers
      tags: [workspaces]
      summary: People in the open workspace
      responses:
        "200":
          description: Members
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/WorkspaceMember" } }
        "401": { description: Sign in required }
  /workspace/members/{userId}:
    put:
      operationId: setWorkspaceMemberRole
      tags: [workspaces]
      summary: Change a member's role (owner only)
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/RoleInput" }
      responses:
        "204": { description: Changed }
        "403": { description: Owner only }
        "404": { description: Not a member }
        "409": { description: The workspace would be left without an owner }
    delete:
      operationId: removeWorkspaceMember
      tags: [workspaces]
      summary: Take a person out of the workspace (owner), or leave it (self). Data stays.
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      responses:
        "204": { description: Removed }
        "403": { description: Owner only }
        "404": { description: Not a member }
        "409": { description: The workspace would be left without an owner }
  /workspace/members/{userId}/clients:
    put:
      operationId: setWorkspaceMemberClients
      tags: [workspaces]
      summary: Limit a member of an agency to some clients, or give them all clients again (owner only)
      parameters:
        - { in: path, name: userId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MemberClientsInput" }
      responses:
        "204": { description: Changed }
        "400": { description: "Not a client of this workspace, or the member is an owner" }
        "403": { description: Owner only }
        "404": { description: Not a member }
        "409": { description: Only an agency can limit members to clients }
  /workspace/invites:
    post:
      operationId: createWorkspaceInvite
      tags: [workspaces]
      summary: Create a one-time invitation link (owner only), optionally limited to some clients of an agency
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/InviteInput" }
      responses:
        "201":
          description: The link token; shown once
          content:
            application/json:
              schema: { $ref: "#/components/schemas/WorkspaceInvite" }
        "400": { description: "Invalid role, or clients that are not in this workspace" }
        "403": { description: Owner only }
        "409": { description: Only an agency can limit an invitation to clients }
  /invites/{token}:
    get:
      operationId: getInvite
      tags: [workspaces]
      summary: What an invitation link opens
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Workspace name and role
          content:
            application/json:
              schema: { $ref: "#/components/schemas/InvitePreview" }
        "404": { description: "Link used, expired or unknown" }
  /invites/{token}/accept:
    post:
      operationId: acceptInvite
      tags: [workspaces]
      summary: Join the workspace of an invitation link and open it
      parameters:
        - { in: path, name: token, required: true, schema: { type: string, maxLength: 100 } }
      responses:
        "200":
          description: Joined and opened
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Workspace" }
        "401": { description: Sign in required }
        "404": { description: "Link used, expired or unknown" }
  /clients:
    get:
      operationId: getClients
      tags: [workspaces]
      summary: Clients of the open workspace
      responses:
        "200":
          description: Clients
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Client" } }
        "401": { description: Sign in required }
    post:
      operationId: createClient
      tags: [workspaces]
      summary: Add a client (returns the existing one if the name is taken)
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "201":
          description: The client
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { description: Invalid name or too many clients }
        "403": { description: Read-only role }
  /clients/{clientId}:
    patch:
      operationId: renameClient
      tags: [workspaces]
      summary: Rename a client
      parameters:
        - { in: path, name: clientId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/NameInput" }
      responses:
        "200":
          description: Renamed
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Client" }
        "400": { description: Invalid or taken name }
        "403": { description: Read-only role }
        "404": { description: Not found }
  /media-plans:
    get:
      operationId: getMediaPlans
      tags: [media]
      summary: The workspace's media plans (optionally of one client) and how platforms compare across all of them
      parameters:
        - { in: query, name: clientId, required: false, schema: { type: string, maxLength: 80 } }
      responses:
        "200":
          description: Plans and platform comparison
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPlansOverview" }
        "401": { description: Sign in required }
    post:
      operationId: createMediaPlan
      tags: [media]
      summary: Save a media plan read from the agency's file
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaPlanInput" }
      responses:
        "201":
          description: Saved
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPlan" }
        "400": { description: Invalid plan }
        "401": { description: Sign in required }
  /media-plans/{planId}:
    get:
      operationId: getMediaPlan
      tags: [media]
      summary: One media plan, its checks and plan against fact
      parameters:
        - { in: path, name: planId, required: true, schema: { type: string } }
      responses:
        "200":
          description: The plan
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPlan" }
        "401": { description: Sign in required }
        "404": { description: Not found }
  /media-plans/{planId}/placements/{placementId}/fact:
    put:
      operationId: saveMediaFact
      tags: [media]
      summary: Record what a placement delivered, from the platform's report
      parameters:
        - { in: path, name: planId, required: true, schema: { type: string } }
        - { in: path, name: placementId, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MediaFactInput" }
      responses:
        "200":
          description: The plan, recalculated
          content:
            application/json:
              schema: { $ref: "#/components/schemas/MediaPlan" }
        "400": { description: Invalid values }
        "401": { description: Sign in required }
        "404": { description: Not found }
  /shift-market/external-media:
    get:
      operationId: getExternalMedia
      tags: [intelligence]
      summary: Get external media impact data
      responses:
        "200":
          description: External media data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalMediaOverview"
  /shift-market/external-media/campaigns:
    post:
      operationId: createExternalCampaign
      tags: [intelligence]
      summary: Add an external campaign event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ExternalCampaignInput"
      responses:
        "201":
          description: Campaign created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ExternalCampaign"
  /shift-market/competitors:
    get:
      operationId: getCompetitors
      tags: [intelligence]
      summary: Get competitor intelligence for a Kaspi SKU
      parameters:
        - in: query
          name: kaspiSku
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 64
      responses:
        "200":
          description: Competitor data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompetitorsOverview"
        "400":
          description: Missing or invalid Kaspi SKU
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [INVALID_KASPI_SKU] }
  /shift-market/content:
    get:
      operationId: getContent
      tags: [intelligence]
      summary: Get content analysis
      responses:
        "200":
          description: Content data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ContentOverview"
  /shift-market/ask:
    post:
      operationId: askAssistant
      tags: [intelligence]
      summary: Ask a question answered only from the app's data
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskInput"
      responses:
        "200":
          description: Assistant answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AskAnswer"
        "400":
          description: Invalid question
          content:
            application/json:
              schema:
                type: object
                required: [error]
                properties:
                  error: { type: string, enum: [INVALID_QUESTION] }
        "429":
          description: Too many requests
  /shift-market/integrations:
    get:
      operationId: getIntegrations
      tags: [intelligence]
      summary: Get connector statuses
      responses:
        "200":
          description: Integration statuses
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationsOverview"
  /shift-market/integrations/kaspi/test:
    post:
      operationId: testKaspiConnection
      tags: [intelligence]
      summary: Test the server-side Kaspi connector
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KaspiConnectionInput"
      responses:
        "200":
          description: Connector test result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IntegrationStatus"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    DataSource:
      type: string
      enum: [DEMO DATA, MOCK, KASPI API, KASPI ADS, REDSTAT, META, USER DATA]
    SourceMessageKey:
      type: string
      enum:
        - connector.kaspi.not_connected
        - connector.demo.active
        - connector.redstat.methods_unconfirmed
        - connector.kaspi.demo_endpoint_unconfigured
        - connector.kaspi.token_required
        - connector.kaspi.coming_soon
        - connector.kaspi.connected
        - connector.kaspi.invalid_token
        - connector.kaspi.unavailable
        - connector.kaspi.sign_in
        - connector.moysklad.connected
        - connector.moysklad.invalid_token
        - connector.moysklad.unavailable
        - connector.mcp.connected
        - connector.mcp.unauthorized
        - connector.mcp.unavailable
        - connector.mcp.unsafe_url
        - connector.redstat.unavailable
        - connector.redstat.connect_in_settings
        - connector.not_connected
        - connector.sync.done
        - connector.sync.truncated
        - connector.sync.interrupted
        - connector.encryption.reset
    ConfidenceSignalKey:
      type: string
      enum:
        - roas_above_benchmark
        - roas_below_benchmark
        - conversion_above_average
        - conversion_below_average
        - stock_sufficient
        - demand_growing
        - price_competitive
        - competitor_undercuts
        - traffic_above_average
        - cpc_above_average
        - ctr_above_average
        - low_competitive_pressure
        - enough_history
        - stock_fresh
        - trend_consistent
        - cost_known
        - commission_known
        - margin_healthy
        - ads_attributed
        - price_stable
        - campaign_finished
        - no_overlap
    ConfidenceBasis:
      type: object
      required: [supporting, total, signals]
      properties:
        supporting: { type: number, minimum: 0 }
        total: { type: number, minimum: 0 }
        signals:
          type: array
          items:
            type: object
            required: [key, met]
            properties:
              key: { $ref: "#/components/schemas/ConfidenceSignalKey" }
              met: { type: boolean }
    Insight:
      type: object
      required: [eyebrow, title, body, confidence, impact, severity]
      properties:
        eyebrow: { type: string }
        title: { type: string }
        body: { type: string }
        confidence: { type: number, minimum: 0, maximum: 100 }
        impact: { type: string }
        severity: { type: string, enum: [LOW, MEDIUM, HIGH] }
        titleKey: { type: string }
        bodyKey: { type: string }
        impactAmount: { type: number }
        params: { $ref: "#/components/schemas/TemplateParams" }
        confidenceBasis: { $ref: "#/components/schemas/ConfidenceBasis" }
    TimelineEvent:
      type: object
      required: [id, date, label, kind, detail]
      properties:
        id: { type: string }
        date: { type: string }
        label: { type: string }
        kind: { type: string, enum: [SALE, ADS, MEDIA, PRICE, PROMO, CONTENT, COMPETITOR, IMPORT, FEEDBACK] }
        detail: { type: string }
    Metric:
      type: object
      required: [label, value, change, positive]
      properties:
        label: { type: string }
        value: { type: string, description: Pre-formatted fallback; clients should prefer amount + unit }
        amount: { type: number }
        unit: { type: string, enum: [CURRENCY, COUNT, MULTIPLIER, DAYS] }
        changePct: { type: [number, "null"] }
        change: { type: string }
        positive: { type: boolean }
        estimated: { type: boolean, description: "True when the value rests on assumptions (default commission, missing cost prices)" }
    DashboardAction:
      type: object
      required: [type, object, signal, explanation, recommendation, confidence, confidenceBasis, impact]
      properties:
        type: { type: string, enum: [SCALE, OPTIMIZE, DEFEND, FIX, WATCH, RESTOCK] }
        confidenceBasis: { $ref: "#/components/schemas/ConfidenceBasis" }
        key: { type: string }
        sku: { type: string }
        reasonKey: { type: string }
        recommendationKey: { type: string }
        params: { $ref: "#/components/schemas/TemplateParams" }
        impactAmount: { type: number }
        verdict: { $ref: "#/components/schemas/Verdict" }
        object: { type: string }
        signal: { type: string }
        explanation: { type: string }
        recommendation: { type: string }
        confidence: { type: number }
        impact: { type: string }
    DashboardOverview:
      type: object
      required: [source, refreshedAt, summary, metrics, actions, timeline, mode]
      properties:
        mode: { $ref: "#/components/schemas/DataMode" }
        period: { type: number }
        compare: { type: string, enum: [previous, year] }
        series:
          type: array
          items: { $ref: "#/components/schemas/SeriesPoint" }
        forecast:
          type: array
          items: { $ref: "#/components/schemas/ForecastItem" }
        assumptions: { $ref: "#/components/schemas/Assumptions" }
        source: { $ref: "#/components/schemas/DataSource" }
        refreshedAt: { type: string }
        dataAsOf: { type: string, description: "Moment the seller's data reaches (last imported order or last Kaspi sync); analysis windows end here." }
        summary: { $ref: "#/components/schemas/Insight" }
        metrics:
          type: array
          items: { $ref: "#/components/schemas/Metric" }
        actions:
          type: array
          items: { $ref: "#/components/schemas/DashboardAction" }
        timeline:
          type: array
          items: { $ref: "#/components/schemas/TimelineEvent" }
    Placement:
      type: object
