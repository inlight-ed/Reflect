        competitorPrice: { type: number }
        trend: { type: number }
        opportunity: { type: string, enum: [SCALE, FIX, DEFEND, STOP, WATCH] }
        trendPct: { type: [number, "null"] }
        avgPrice: { type: [number, "null"] }
        costPrice: { type: [number, "null"] }
        unitMargin: { type: [number, "null"] }
        marginPct: { type: [number, "null"] }
        velocity: { type: number }
        stockoutDate: { type: [string, "null"] }
        reorderQty: { type: [number, "null"] }
