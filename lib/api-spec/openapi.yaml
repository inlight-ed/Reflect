      required: [name, status, source, detail]
      properties:
        name: { type: string }
        status: { type: string, enum: [NOT_CONNECTED, CONNECTED, ERROR, DEMO] }
        source: { $ref: "#/components/schemas/DataSource" }
        detail: { $ref: "#/components/schemas/SourceMessageKey" }
    IntegrationsOverview:
      type: object
      required: [kaspi, redstat, media]
      properties:
        connections:
          type: array
          items: { $ref: "#/components/schemas/Connection" }
        kaspi: { $ref: "#/components/schemas/IntegrationStatus" }
        redstat: { $ref: "#/components/schemas/IntegrationStatus" }
        media:
          type: array
          items: { $ref: "#/components/schemas/IntegrationStatus" }
    TemplateParams:
      type: object
      additionalProperties:
        oneOf:
          - { type: string }
          - { type: number }
    DataMode:
      type: string
      enum: [DEMO, USER, EMPTY]
    Verdict:
      type: string
      enum: [WORKED, NOT_WORKED, TOO_EARLY]
    SeriesPoint:
      type: object
      required: [period, total, previous, orders]
      properties:
        period: { type: string }
        total: { type: number }
        previous: { type: number }
        orders: { type: number }
    ForecastItem:
      type: object
      required: [sku, name, stock, velocity, coverDays, stockoutDate, reorderQty, leadTimeDays]
      properties:
        sku: { type: string }
        name: { type: string }
        stock: { type: number }
        velocity: { type: number }
        coverDays: { type: number }
        stockoutDate: { type: string }
        reorderQty: { type: number }
        leadTimeDays: { type: number }
    Assumptions:
      type: object
      required: [commissionAssumed, missingCosts, missingStock, productCount]
      properties:
        commissionAssumed: { type: boolean }
        defaultCommissionPct: { type: number }
        missingCosts: { type: number }
        missingStock: { type: number }
        productCount: { type: number }
        costCoveragePct:
          type: [number, "null"]
          description: Share of the period's revenue from products with a known cost price, 0–100. Profit is preliminary below 100.
        stockCoveragePct:
          type: [number, "null"]
          description: Share of the period's revenue from products with a known stock level, 0–100.
        lastOrderAt:
          type: [string, "null"]
          description: Newest order in the data; shows how fresh the numbers are.
    SkuAd:
      type: object
      required: [sku, name, spend, revenue]
      properties:
        sku: { type: string }
        name: { type: string }
        spend: { type: number }
        revenue: { type: number }
        roas: { type: [number, "null"] }
        breakevenRoas: { type: [number, "null"] }
    CampaignImpact:
      type: object
      required: [campaignId, periods, baseline, incremental, confidence, confidenceBasis]
      properties:
        campaignId: { type: string }
        periods:
          type: array
          items: { $ref: "#/components/schemas/ImpactPeriod" }
        baseline: { type: number }
        incremental: { type: number }
        confidence: { type: number }
        confidenceBasis: { $ref: "#/components/schemas/ConfidenceBasis" }
    AuthUser:
      type: object
      required: [id, email]
      properties:
        id: { type: string }
        email: { type: string }
        name: { type: [string, "null"] }
    AuthErrorBody:
      type: object
      required: [error]
      properties:
        error: { type: string, enum: [INVALID_EMAIL, WEAK_PASSWORD, EMAIL_TAKEN, INVALID_CREDENTIALS, ACCOUNTS_UNAVAILABLE, RATE_LIMITED, INVALID_RESET_LINK, TEMPORARILY_UNAVAILABLE] }
    RegisterInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 8, maxLength: 200 }
        name: { type: string, maxLength: 80 }
    OkResponse:
      type: object
      required: [ok]
      properties:
        ok: { type: boolean }
    PasswordResetRequest:
      type: object
      required: [email]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
    PasswordResetInput:
      type: object
      required: [token, password]
      properties:
        token: { type: string, minLength: 20, maxLength: 200 }
        password: { type: string, minLength: 1, maxLength: 200 }
    LoginInput:
      type: object
      required: [email, password]
      properties:
        email: { type: string, minLength: 3, maxLength: 254 }
        password: { type: string, minLength: 1, maxLength: 200 }
    Workspace:
      type: object
      required: [id, kind, name, role, restricted]
      properties:
        id: { type: string }
        kind: { type: string, enum: [SHOP, AGENCY] }
        name: { type: string }
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
        restricted: { type: boolean, description: "True when the person sees only the clients given to them" }
    WorkspaceInput:
      type: object
      required: [kind, name]
      properties:
        kind: { type: string, enum: [SHOP, AGENCY] }
        name: { type: string, minLength: 1, maxLength: 80 }
    NameInput:
      type: object
      required: [name]
      properties:
        name: { type: string, minLength: 1, maxLength: 80 }
    RoleInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
    InviteInput:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
        clientIds:
          type: [array, "null"]
          maxItems: 200
          items: { type: string, maxLength: 80 }
          description: "Agency clients the invited person will see; leave out or null for all clients. Not for owners."
    MemberClientsInput:
      type: object
      required: [clientIds]
      properties:
        clientIds:
          type: [array, "null"]
          maxItems: 200
          items: { type: string, maxLength: 80 }
          description: "Agency clients the member may see (an empty list means none); null gives all clients."
    WorkspaceMember:
      type: object
      required: [userId, email, role, joinedAt, clientIds]
      properties:
        userId: { type: string }
        email: { type: string }
        name: { type: [string, "null"] }
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
        clientIds:
          type: [array, "null"]
          items: { type: string }
          description: "Clients this member sees; null means all of them"
        joinedAt: { type: string }
    WorkspaceInvite:
      type: object
      required: [token, role, expiresAt]
      properties:
        token: { type: string }
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
        clientIds: { type: [array, "null"], items: { type: string } }
        expiresAt: { type: string }
    InvitePreview:
      type: object
      required: [name, kind, role, restricted]
      properties:
        name: { type: string }
        kind: { type: string, enum: [SHOP, AGENCY] }
        role: { type: string, enum: [OWNER, MEMBER, VIEWER] }
        restricted: { type: boolean, description: "The link gives access to some clients only" }
    Client:
      type: object
      required: [id, name, createdAt, plans]
      properties:
        id: { type: string }
        name: { type: string }
        createdAt: { type: string }
        plans: { type: integer, description: "Media plans of this client" }
    SessionState:
      type: object
      required: [accountsEnabled, hasData]
      properties:
        user: { $ref: "#/components/schemas/AuthUser" }
        workspace: { $ref: "#/components/schemas/Workspace" }
        workspaces:
          type: array
          items: { $ref: "#/components/schemas/Workspace" }
        accountsEnabled: { type: boolean }
        hasData: { type: boolean }
        hasProducts: { type: boolean }
        hasConnections: { type: boolean }
    OrderRowInput:
      type: object
      required: [orderedAt, sku, quantity, amount]
      properties:
        orderCode: { type: [string, "null"], maxLength: 80 }
        orderedAt: { type: string, maxLength: 40 }
        sku: { type: string, minLength: 1, maxLength: 120 }
        productName: { type: [string, "null"], maxLength: 400 }
        quantity: { type: number }
        amount: { type: number }
        status: { type: [string, "null"], maxLength: 80 }
    ProductRowInput:
      type: object
      required: [sku]
      properties:
        sku: { type: string, minLength: 1, maxLength: 120 }
        name: { type: [string, "null"], maxLength: 400 }
        category: { type: [string, "null"], maxLength: 200 }
        kaspiCode: { type: [string, "null"], maxLength: 60 }
        costPrice: { type: [number, "null"] }
        stock: { type: [number, "null"] }
        leadTimeDays: { type: [number, "null"] }
        commissionPct: { type: [number, "null"] }
        logisticsCost: { type: [number, "null"], description: "Per unit, ₸: delivery the seller pays" }
        otherCost: { type: [number, "null"], description: "Per unit, ₸: packaging and other costs" }
    ProductCostsInput:
      type: object
      required: [sku]
      properties:
        sku: { type: string, minLength: 1, maxLength: 80 }
        costPrice: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        logisticsCost: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        otherCost: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        commissionPct: { type: [number, "null"], minimum: 0, maximum: 100 }
        stock: { type: [number, "null"], minimum: 0, maximum: 1000000000 }
        leadTimeDays: { type: [integer, "null"], minimum: 1, maximum: 365 }
    AdRowInput:
      type: object
      required: [day, spend]
      properties:
        day: { type: string, maxLength: 40 }
        sku: { type: [string, "null"], maxLength: 120 }
        channel: { type: [string, "null"], maxLength: 80 }
        spend: { type: number }
    ImportInput:
      type: object
      required: [kind]
      properties:
        kind: { type: string, enum: [ORDERS, PRODUCTS, ADS] }
        fileName: { type: string, maxLength: 200 }
        orders:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/OrderRowInput" }
        products:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/ProductRowInput" }
        ads:
          type: array
          maxItems: 5000
          items: { $ref: "#/components/schemas/AdRowInput" }
    ImportResult:
      type: object
      required: [accepted, skipped]
      properties:
        accepted: { type: number }
        skipped: { type: number }
    DataImport:
      type: object
      required: [id, kind, source, rows, createdAt]
      properties:
        id: { type: string }
        kind: { type: string, enum: [ORDERS, PRODUCTS, ADS] }
        source: { type: string }
        fileName: { type: [string, "null"] }
        rows: { type: number }
        createdAt: { type: string }
    DataStatus:
      type: object
      required: [orders, products, ads, imports]
      properties:
        orders: { type: number }
        products: { type: number }
        ads: { type: number }
        firstOrderAt: { type: [string, "null"] }
        lastOrderAt: { type: [string, "null"] }
        imports:
          type: array
          items: { $ref: "#/components/schemas/DataImport" }
    FeedbackInput:
      type: object
      required: [actionKey, actionType, object, verdict]
      properties:
        actionKey: { type: string, maxLength: 200 }
        actionType: { type: string, maxLength: 20 }
        sku: { type: string, maxLength: 120 }
        object: { type: string, maxLength: 300 }
        verdict: { $ref: "#/components/schemas/Verdict" }
    FeedbackItem:
      type: object
      required: [id, actionKey, actionType, object, verdict, createdAt]
      properties:
        id: { type: string }
        actionKey: { type: string }
        actionType: { type: string }
        sku: { type: [string, "null"] }
        object: { type: string }
        verdict: { $ref: "#/components/schemas/Verdict" }
        createdAt: { type: string }
        beforePerDay: { type: [number, "null"] }
        afterPerDay: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
        daysAfter: { type: number }
    CardEventInput:
      type: object
      required: [sku, kind]
      properties:
        sku: { type: string, minLength: 1, maxLength: 120 }
        kind: { type: string, enum: [PHOTO, TITLE, DESCRIPTION, PRICE, OTHER] }
        note: { type: string, maxLength: 300 }
        happenedAt: { type: string, maxLength: 40 }
    CardEvent:
      type: object
      required: [id, sku, kind, happenedAt]
      properties:
        id: { type: string }
        sku: { type: string }
        kind: { type: string, enum: [PHOTO, TITLE, DESCRIPTION, PRICE, OTHER] }
        note: { type: [string, "null"] }
        happenedAt: { type: string }
        beforePerDay: { type: [number, "null"] }
        afterPerDay: { type: [number, "null"] }
        changePct: { type: [number, "null"] }
        daysAfter: { type: number }
    CheckItem:
      type: object
      required: [key, status]
      properties:
        key: { type: string }
        status: { type: string, enum: [PASS, WARN, UNKNOWN] }
        params: { $ref: "#/components/schemas/TemplateParams" }
    ReviewSummary:
      type: object
      required: [count]
      properties:
        averageRating: { type: [number, "null"] }
        count: { type: number }
        positive: { type: [number, "null"] }
        negative: { type: [number, "null"] }
    ReviewThemes:
      type: object
      required: [praise, complaints, mode]
      properties:
        praise:
          type: array
          items: { type: string }
        complaints:
          type: array
          items: { type: string }
        mode: { type: string, enum: [AI, RULES] }
    CardAnalysis:
      type: object
      required: [mode, products, checklist, events, source]
      properties:
        mode: { $ref: "#/components/schemas/DataMode" }
        source: { $ref: "#/components/schemas/DataSource" }
        detail: { $ref: "#/components/schemas/SourceMessageKey" }
        products:
          type: array
          items:
            type: object
            required: [sku, name]
            properties:
              sku: { type: string }
              name: { type: string }
              kaspiCode: { type: [string, "null"] }
        sku: { type: string }
        name: { type: string }
        kaspiCode: { type: [string, "null"] }
        kaspiUrl: { type: string }
        revenue: { type: number }
        trendPct: { type: [number, "null"] }
        checklist:
          type: array
          items: { $ref: "#/components/schemas/CheckItem" }
        reviews: { $ref: "#/components/schemas/ReviewSummary" }
        themes: { $ref: "#/components/schemas/ReviewThemes" }
        events:
          type: array
          items: { $ref: "#/components/schemas/CardEvent" }
    ConnectionKind:
      type: string
      enum: [KASPI_API, MOYSKLAD, REDSTAT_MCP, CUSTOM_MCP]
    ConnectionInput:
      type: object
      properties:
        url: { type: string, maxLength: 500 }
        secret: { type: string, maxLength: 4096 }
    McpTool:
      type: object
      required: [name, description]
      properties:
        name: { type: string }
        description: { type: string }
    Connection:
      type: object
      required: [kind, status]
      properties:
        kind: { $ref: "#/components/schemas/ConnectionKind" }
        url: { type: [string, "null"] }
        secretHint: { type: [string, "null"] }
        status: { type: string, enum: [CONNECTED, ERROR, SYNCING, NOT_CONNECTED] }
        detail: { $ref: "#/components/schemas/SourceMessageKey" }
        lastSyncAt: { type: [string, "null"] }
        imported: { type: number }
        tools:
          type: array
          items: { $ref: "#/components/schemas/McpTool" }
    SyncRun:
      type: object
      required: [id, kind, status, startedAt]
      properties:
        id: { type: string }
        kind: { $ref: "#/components/schemas/ConnectionKind" }
        status: { type: string, enum: [RUNNING, DONE, FAILED] }
        detail: { $ref: "#/components/schemas/SourceMessageKey" }
        rows: { type: [number, "null"] }
        startedAt: { type: string }
        finishedAt: { type: [string, "null"] }
    AskInput:
      type: object
      required: [question, locale]
      properties:
        question: { type: string, minLength: 2, maxLength: 500 }
        locale: { type: string, enum: [ru, kk, en] }
    AskAnswer:
      type: object
      required: [answer, mode, insufficientData, references]
      properties:
        answer: { type: string }
        mode: { type: string, enum: [AI, RULES] }
        insufficientData: { type: boolean }
        references:
          type: array
          items: { type: string }
    KaspiConnectionInput:
      type: object
      required: [token]
      properties:
        token: { type: string, minLength: 1, maxLength: 4096 }

